<html>
  <head>
    <script src="/js/main.js" type="text/javascript"></script>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="pv1Gr5.png">
    <link rel="icon" href="pv1Gr5.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Just one boss</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }

      /* Center + square scaling */
      #game-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 100vh;
        width: auto;
        aspect-ratio: 1 / 1;
      }

      canvas#canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 0;
      }

      .pico8_el {
        float: left;
        width: 92px;
        margin: 1px;
        padding: 4px;
        text-align: center;
        color: #fff;
        background-color: #777;
        font-family: verdana;
        font-size: 9pt;
        cursor: pointer;
      }

      .pico8_el:hover {
        background-color: #aaa;
      }
    </style>
  </head>

  <body>
    <div id="game-container">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <script>
      var canvas = document.getElementById("canvas");

      // IMPORTANT: keep internal resolution square, don't use window size
      canvas.width = 512;
      canvas.height = 512;

      var Module = {};
      Module.canvas = canvas;
    </script>

    <script async src="just_one_boss.js"></script>

    <script>
      function onKeyDown_blocker(event) {
        event = event || window.event;
        var o = document.activeElement;
        if (!o || o == document.body || o.tagName == "CANVAS") {
          if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
            event.preventDefault();
          }
        }
      }
      document.addEventListener("keydown", onKeyDown_blocker, false);
    </script>
  </body>
</html>
