<html>

    <style>
      /* Reset default spacing */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Full-page layout */
html, body {
  height: 100%;
}

/* Center everything */
body {
  display: flex;
  flex-direction: column;        /* stack text + canvas */
  justify-content: center;       /* vertical center */
  align-items: center;           /* horizontal center */
  background-color: #000;        /* optional: dark background */
  color: #fff;                  /* optional: text color */
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 10px;
}

/* Style the instructions text */
body {
  font-size: 16px;
  line-height: 1.5;
}

/* Ensure canvas is centered and behaves */
canvas {
  display: block;
  margin: 10px auto;             /* spacing from text */
  max-width: 100%;               /* responsive */
  height: auto;
}
    </style>

    Controls: X to jump, Z to chill, arrow keys to move, ENTER to start/pause.
