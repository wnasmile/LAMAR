<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matrix Rampage</title>
    <link rel="icon" type="image/x-icon" href="matrixrampage.jpg" />
    <link rel="shortcut icon" type="image/x-icon" href="matrixrampage.jpg" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #ruffle {
        position: fixed; /* ensures true viewport coverage */
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }

      #ruffle > * {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <script src="/js/main.js"></script>

    <div id="ruffle"></div>

    <script src="ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};

      window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        const container = document.getElementById("ruffle");

        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";

        container.appendChild(player);
        player.load("matrixrampage.swf");
      });
    </script>
  </body>
</html>
