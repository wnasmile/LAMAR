<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Knight</title>
    <link rel="icon" type="image/x-icon" href="blackknight.png" />
    <link rel="shortcut icon" type="image/x-icon" href="blackknight.png" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #ruffle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        height: 100vh;
        width: auto;
        aspect-ratio: 1 / 1;
      }

      #ruffle > * {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <script src="/js/main.js"></script>

    <div id="ruffle"></div>

    <script src="ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};

      window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        const container = document.getElementById("ruffle");

        player.id = "player";

        // Let CSS control sizing instead of forcing viewport stretch
        player.style.width = "100%";
        player.style.height = "100%";

        container.appendChild(player);
        player.load("black_knight.swf");
      });
    </script>
  </body>
</html>
